name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build macOS DMG, Windows Installer & Windows Uninstaller
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
          use-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Resolve package version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not resolve version from package.json" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved release version: ${VERSION}"

      - name: Audit dependencies, verify Xbox GDK bridges, typecheck & run unit tests
        run: |
          npm audit --audit-level=high
          node scripts/build-xbox-bridge.cjs --verify
          node scripts/windows-uninstaller/verify-uninstaller.cjs
          npm run typecheck
          npm run test:unit

      - name: Ensure bundled CLI permissions & build macOS universal helpers
        run: |
          chmod +x electron/bin/*/darwin/* 2>/dev/null || true
          npm run build:macos-helpers

      - name: Build macOS ARM64 DMG
        env:
          RAW_CSC_LINK: ${{ secrets.CSC_LINK }}
          RAW_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$RAW_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY="true"
            export CSC_LINK="$RAW_CSC_LINK"
            export CSC_KEY_PASSWORD="$RAW_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY="false"
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          npm run dist:mac

      - name: Build Windows x64 Installer & Standalone Full Uninstaller
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p release
          npx electron-builder --win --x64 --publish never
          npm run build:win-uninstaller
          cp "build/Uninstall-OneLauncher.ps1" "release/Uninstall-OneLauncher.ps1"
          cp "build/Uninstall One Launcher (Full Clean).bat" "release/Uninstall One Launcher (Full Clean).bat"

      - name: Verify release artifacts, app.asar size (< 15 MB), macOS Hardened Runtime signature & SHA256SUMS
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_ARTIFACT="release/One Launcher-${VERSION}-arm64.dmg"
          WIN_INSTALLER="release/One Launcher Setup ${VERSION}.exe"
          WIN_UNINSTALLER="release/One Launcher Full Uninstaller.exe"

          ls -lh "$DMG_ARTIFACT" "$WIN_INSTALLER" "$WIN_UNINSTALLER"

          ASAR_PATH="release/mac-arm64/One Launcher.app/Contents/Resources/app.asar"
          ASAR_SIZE_BYTES=$(stat -f%z "$ASAR_PATH")
          MAX_ASAR_BYTES=$((15 * 1024 * 1024))
          echo "Verified app.asar size: ${ASAR_SIZE_BYTES} bytes (limit: ${MAX_ASAR_BYTES} bytes)"
          if [ "$ASAR_SIZE_BYTES" -ge "$MAX_ASAR_BYTES" ]; then
            echo "ERROR: app.asar (${ASAR_SIZE_BYTES} bytes) exceeds 15 MB budget (${MAX_ASAR_BYTES} bytes)!" >&2
            exit 1
          fi

          lipo -archs "release/mac-arm64/One Launcher.app/Contents/Resources/app.asar.unpacked/electron/helpers/libone_metal_preload.dylib"
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/One Launcher.app"

          (
            cd release
            shasum -a 256 \
              "One Launcher-${VERSION}-arm64.dmg" \
              "One Launcher Setup ${VERSION}.exe" \
              "One Launcher Full Uninstaller.exe" \
              > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Recreate clean GitHub Release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --prune --prune-tags --force
          while IFS= read -r REL_TAG; do
            if [ -n "$REL_TAG" ] && ! git show-ref --verify --quiet "refs/tags/${REL_TAG}"; then
              echo "Pruning orphaned GitHub Release for deleted tag: ${REL_TAG}"
              gh release delete "$REL_TAG" --yes || true
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          if [ "$CURRENT_REF_TYPE" = "tag" ] && [ -n "$CURRENT_REF_NAME" ]; then
            gh release delete "$CURRENT_REF_NAME" --yes || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: One Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }} (macOS & Windows)
          generate_release_notes: false
          body: |
            ## One Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}

            Universal game library and launcher for **Steam**, **GOG.com**, **Epic Games Store**, **Xbox / PC Game Pass**, and **Custom** games on **macOS** (Native + Bottled CrossOver / GPTK / Wine) and **Windows** (Native).

            ---

            ### 📥 Downloads

            * 🍎 **Mac Users (Apple Silicon M1/M2/M3/M4):**
              1. Download **`One.Launcher-${{ steps.meta.outputs.version }}-arm64.dmg`**, open it, and drag **One Launcher** to your **Applications** folder.
              2. **First-Launch Gatekeeper Note:** Because this open-source build is ad-hoc signed rather than notarized with a paid Apple Developer account, macOS may block opening it after a browser download. To clear the browser quarantine flag, run this one-liner in **Terminal**:
                 ```bash
                 xattr -cr "/Applications/One Launcher.app"
                 ```
            * 🪟 **Windows Users (64-bit):**
              Download **`One.Launcher.Setup.${{ steps.meta.outputs.version }}.exe`** and run the installer.
            * 🧹 **Windows Complete Uninstaller (Optional):**
              Download **`One.Launcher.Full.Uninstaller.exe`** if you ever want to completely remove One Launcher, all cached data/logins, and GOG Galaxy 2.0 integration entries from a Windows PC.
            * 🔐 **Integrity Verification:**
              Verify artifact checksums against **`SHA256SUMS.txt`**.
          files: |
            release/One Launcher-${{ steps.meta.outputs.version }}-arm64.dmg
            release/One Launcher Setup ${{ steps.meta.outputs.version }}.exe
            release/One Launcher Full Uninstaller.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
