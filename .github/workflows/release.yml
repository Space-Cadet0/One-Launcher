name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build macOS DMG, Windows Installer & Windows Uninstaller
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure bundled CLI binary permissions
        run: chmod +x electron/bin/arm64/darwin/* || true

      - name: Build macOS ARM64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Build Windows x64 Installer & Standalone Full Uninstaller
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never && npm run build:win-uninstaller

      - name: Verify release artifacts & macOS code signature
        run: |
          ls -lh \
            "release/One Launcher-0.1.0-arm64.dmg" \
            "release/One Launcher Setup 0.1.0.exe" \
            "release/One Launcher Full Uninstaller.exe"
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/One Launcher.app"

      - name: Recreate clean GitHub Release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: One Launcher ${{ github.ref_name }} (macOS & Windows)
          generate_release_notes: false
          body: |
            ## One Launcher ${{ github.ref_name }}

            Universal game library and launcher for **Steam**, **GOG.com**, and **Epic Games Store** on **macOS** and **Windows**.

            ---

            ### 📥 Downloads

            * 🍎 **Mac Users (Apple Silicon M1/M2/M3/M4):**
              1. Download **`One.Launcher-0.1.0-arm64.dmg`**, open it, and drag **One Launcher** to your **Applications** folder.
              2. **First-Launch Gatekeeper Note:** Because this open-source build is ad-hoc signed rather than notarized with a paid Apple Developer account, macOS may block opening it after a browser download. To clear the browser quarantine flag, run this one-liner in **Terminal**:
                 ```bash
                 xattr -cr "/Applications/One Launcher.app"
                 ```
            * 🪟 **Windows Users (64-bit):**
              Download **`One.Launcher.Setup.0.1.0.exe`** and run the installer.
            * 🧹 **Windows Complete Uninstaller (Optional):**
              Download **`One.Launcher.Full.Uninstaller.exe`** if you ever want to completely remove One Launcher, all cached data/logins, and GOG Galaxy 2.0 integration entries from a Windows PC.
          files: |
            release/One Launcher-0.1.0-arm64.dmg
            release/One Launcher Setup 0.1.0.exe
            release/One Launcher Full Uninstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
