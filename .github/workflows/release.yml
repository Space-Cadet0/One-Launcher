name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build macOS DMG, Windows Installer & Windows Uninstaller
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
          use-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Resolve package version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not resolve version from package.json" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved release version: ${VERSION}"

      - name: Audit dependencies, verify Xbox GDK bridges, typecheck & run unit tests
        run: |
          npm audit --audit-level=high
          node scripts/build-xbox-bridge.cjs --verify
          node scripts/build-display-scaler.cjs --verify
          node scripts/windows-uninstaller/verify-uninstaller.cjs
          npm run typecheck
          npm run test:unit

      - name: Ensure bundled CLI permissions & build macOS universal helpers
        run: |
          chmod +x electron/bin/*/darwin/* 2>/dev/null || true
          npm run build:macos-helpers

      - name: Build macOS ARM64 DMG
        env:
          RAW_CSC_LINK: ${{ secrets.CSC_LINK }}
          RAW_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$RAW_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY="true"
            export CSC_LINK="$RAW_CSC_LINK"
            export CSC_KEY_PASSWORD="$RAW_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY="false"
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          npm run dist:mac

      - name: Build Windows x64 Installer & Standalone Full Uninstaller
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p release
          npx electron-builder --win --x64 --publish never
          npm run build:win-uninstaller
          cp "build/Uninstall-OneLauncher.ps1" "release/Uninstall-OneLauncher.ps1"
          cp "build/Uninstall One Launcher (Full Clean).bat" "release/Uninstall One Launcher (Full Clean).bat"

      - name: Verify release artifacts, app.asar size (< 15 MB), macOS Hardened Runtime signature & SHA256SUMS
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG_ARTIFACT="release/One Launcher-${VERSION}-arm64.dmg"
          WIN_INSTALLER="release/One Launcher Setup ${VERSION}.exe"
          WIN_UNINSTALLER="release/One Launcher Full Uninstaller.exe"

          ls -lh "$DMG_ARTIFACT" "$WIN_INSTALLER" "$WIN_UNINSTALLER"

          ASAR_PATH="release/mac-arm64/One Launcher.app/Contents/Resources/app.asar"
          ASAR_SIZE_BYTES=$(stat -f%z "$ASAR_PATH")
          MAX_ASAR_BYTES=$((15 * 1024 * 1024))
          echo "Verified app.asar size: ${ASAR_SIZE_BYTES} bytes (limit: ${MAX_ASAR_BYTES} bytes)"
          if [ "$ASAR_SIZE_BYTES" -ge "$MAX_ASAR_BYTES" ]; then
            echo "ERROR: app.asar (${ASAR_SIZE_BYTES} bytes) exceeds 15 MB budget (${MAX_ASAR_BYTES} bytes)!" >&2
            exit 1
          fi

          lipo -archs "release/mac-arm64/One Launcher.app/Contents/Resources/app.asar.unpacked/electron/helpers/libone_metal_preload.dylib"
          lipo -archs "release/mac-arm64/One Launcher.app/Contents/Resources/app.asar.unpacked/electron/helpers/libone_coop_activate.dylib"
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/One Launcher.app"

          (
            cd release
            shasum -a 256 \
              "One Launcher-${VERSION}-arm64.dmg" \
              "One Launcher Setup ${VERSION}.exe" \
              "One Launcher Full Uninstaller.exe" \
              > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Recreate clean GitHub Release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
        run: |
          git fetch --tags --prune --prune-tags --force
          while IFS= read -r LINE; do
            REL_ID=$(printf '%s' "$LINE" | awk '{print $1}')
            REL_TAG=$(printf '%s' "$LINE" | awk '{print $2}')
            REL_DRAFT=$(printf '%s' "$LINE" | awk '{print $3}')
            if [ -z "$REL_ID" ]; then
              continue
            fi
            if [ "$REL_DRAFT" = "true" ] || [ "$REL_TAG" = "$TARGET_TAG" ] || ! git show-ref --verify --quiet "refs/tags/${REL_TAG}"; then
              echo "Deleting stale/draft GitHub Release ID ${REL_ID} (tag=${REL_TAG}, draft=${REL_DRAFT})"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" || true
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name) \(.draft)"' 2>/dev/null || true)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: One Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }} (macOS & Windows)
          generate_release_notes: false
          body: |
            ## One Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}

            Universal game library and launcher for **Steam**, **GOG.com**, **Epic Games Store**, **Xbox / PC Game Pass**, and **Custom** games on **macOS** (Native + Bottled CrossOver / GPTK / Wine) and **Windows** (Native).

            ---

            ### ✨ Highlights in ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}

            * **Total Architectural Refactor, Performance & Security Hardening**: Cycle-free 3-layer Vite bundle DAG (`-69.4%` cold-boot `index` JS payload, `0` chunks `> 500 kB`), root `<AppErrorBoundary>` + `<ModalErrorBoundary>` fault isolation with `lazyWithRetry` and self-healing `#root[inert]` modal locks, WCAG 2.2 AA & Modern Web upgrades (native `<dialog>`, roving-`tabIndex` `role="menubar"`, `<search>`, IME-safe `Enter`), HTTP `206` `ol-media://` byte-range streaming, multi-mutex `TokenVault` with OAuth refresh-token lineage protection, GOG `v1/catalog` `query=like:` & QA sandbox self-healing, trusted IPC sender enforcement, and even-dimension Win32 Display Scaler viewports (`0px` mouselook drift + `#32770` modal promotion).
            * **Library Match & Overrides Studio Post-Sync Stability & Modal Fault Isolation**: Fixes an uncaught blank-screen crash (`#0e141b`) when opening **Library Match & Overrides Studio** after storefront or background syncing by normalizing suppressed non-game catalog records (`rawGame` invariant across IPC, storage hydration, and live sync), live-subscribing the Studio to mid-session suppressed-entry updates, hardening sparse platform arrays, and isolating all lazy modal/drawer portals behind a Top-Layer `<ModalErrorBoundary>` with retryable chunk loading.
            * **Universal Xbox / PC Game Pass Sign-In Fix on Windows & Fresh Installs (Passkey & Password)**: Eliminates the post-login `HTTP 400` authentication error by switching primary Xbox sign-in to official `LiveSDK` Desktop OAuth 2.0 (`oauth20_authorize.srf` -> `oauth20_desktop.srf`) with native Chromium WebAuthn / Windows Hello passkey support, 90-day refresh token persistence, and CSPRNG CSRF validation, while normalizing 5-segment Compact JWE `RST2.srf` `TOKEN_BROKER` tickets (`d=<jwe>` -> `t=<jwe>`) and preserving on-demand `.msixvc` CIK license acquisition.
            * **Multi-Hop Chained Launcher Injection & Companion Stub Discovery (macOS)**: Automatic structural `<Stem>.exe` bootstrapper promotion alongside `<Stem>Main.exe` / `<Stem>Game.exe` / `<Stem>Client.exe` binaries (zero manual *"Locate Installed Game"* overrides) and full `CreateProcess*` + `ShellExecute*` (`ShellExecuteExW/A`, `ShellExecuteW/A`) child-process chaining across arbitrary multi-hop launcher and map-reload handoffs.
            * **Full-Screen Retina Mouse Hit-Testing & OpenGL State Preservation**: Intercepts Wine's internal `D3DKMTEscape` / `NtGdiDdDDIEscape` (`0x80000001`) `present_rect` clamp so full-screen Retina windows retain `1:1` click hit-testing across the entire physical display, makes `OneLauncherGLHostChild` click-transparent (`HTTRANSPARENT`), chains `GWLP_WNDPROC` cleanly, and preserves `GL_VIEWPORT` / `GL_SCISSOR_BOX` across Direct3D/OpenGL mode switches.
            * **Universal Bottled Fullscreen & Retina HiDPI Virtualization**: Clean-room dual-architecture (`PE32` `x86` + `PE32+` `x86_64`) Win32 display virtualizer (`one_display_scaler_{x86,x64}.dll` + `one_display_launcher_{x86,x64}.exe`) with centered aspect-preserved (`4:3`, `16:10`, `16:9`, integer, stretch) presentation, legacy DirectDraw `16bpp` menu compatibility alongside crisp `32bpp` D3D8/D3D9 rendering, live `Ctrl+Option+F` `2x` Retina Windowed toggling, and cooperative `Cmd+Tab` focus handoff (`libone_coop_activate.dylib`).

            ---

            ### 📥 Downloads

            * 🍎 **Mac Users (Apple Silicon M1/M2/M3/M4):**
              1. Download **`One.Launcher-${{ steps.meta.outputs.version }}-arm64.dmg`**, open it, and drag **One Launcher** to your **Applications** folder.
              2. **First-Launch Gatekeeper Note:** Because this open-source build is ad-hoc signed rather than notarized with a paid Apple Developer account, macOS may block opening it after a browser download. To clear the browser quarantine flag, run this one-liner in **Terminal**:
                 ```bash
                 xattr -cr "/Applications/One Launcher.app"
                 ```
            * 🪟 **Windows Users (64-bit):**
              Download **`One.Launcher.Setup.${{ steps.meta.outputs.version }}.exe`** and run the installer.
            * 🧹 **Windows Complete Uninstaller (Optional):**
              Download **`One.Launcher.Full.Uninstaller.exe`** if you ever want to completely remove One Launcher, all cached data/logins, and GOG Galaxy 2.0 integration entries from a Windows PC.
            * 🔐 **Integrity Verification:**
              Verify artifact checksums against **`SHA256SUMS.txt`**.
          files: |
            release/One Launcher-${{ steps.meta.outputs.version }}-arm64.dmg
            release/One Launcher Setup ${{ steps.meta.outputs.version }}.exe
            release/One Launcher Full Uninstaller.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
