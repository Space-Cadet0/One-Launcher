name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
          use-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime & dev dependencies
        run: npm audit --audit-level=high

      - name: Build & verify deterministic Win32 PE64 Xbox GDK bridges
        run: node scripts/build-xbox-bridge.cjs --verify

      - name: Build & verify macOS universal Metal helper
        if: runner.os == 'macOS'
        run: |
          npm run build:macos-helpers
          lipo -archs electron/helpers/libone_metal_preload.dylib
          codesign --verify --verbose=2 electron/helpers/libone_metal_preload.dylib

      - name: Run Layer 1 Host Clang C11 ASan + UBSan native harness
        if: runner.os == 'macOS'
        run: npm run test:native-asan

      - name: Typecheck source, electron & test suites
        run: npm run typecheck

      - name: Run hermetic unit & contract tests
        run: npm run test:unit

      - name: Build production renderer bundle
        run: npm run build

      - name: Package unpacked desktop bundle & run afterPack diet/signing verification
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --dir --publish never

      - name: Verify single-source Windows uninstaller & compile standalone NSIS uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/windows-uninstaller/verify-uninstaller.cjs
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $makensis = if (Get-Command makensis -ErrorAction SilentlyContinue) {
            (Get-Command makensis).Source
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            "C:\Program Files (x86)\NSIS\makensis.exe"
          } else {
            choco install nsis -y --no-progress | Out-Host
            "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis build/standalone-uninstaller.nsi
          if (-not (Test-Path -LiteralPath "release/One Launcher Full Uninstaller.exe")) {
            throw "Expected release/One Launcher Full Uninstaller.exe was not generated"
          }
          Get-Item -LiteralPath "release/One Launcher Full Uninstaller.exe" | Select-Object Name, Length
